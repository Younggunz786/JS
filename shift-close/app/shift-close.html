<title>Perth Road Shift Close</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: one work column on phones; on wide screens the shift form sits left with the live result pinned right. */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --sunk:#e9ebe5; --ink:#18211d; --muted:#5a665f; --line:#d6dbd2;
  --accent:#1d5c86; --accent-ink:#ffffff; --good:#2c7a4b; --warn:#a86a12; --bad:#b3261e;
  --good-bg:#e3f1e8; --warn-bg:#fbefd9; --bad-bg:#fbe4e1;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#191f1c; --sunk:#222a26; --ink:#e4eae6; --muted:#97a39c; --line:#2d3631;
  --accent:#74b3de; --accent-ink:#0d1a24; --good:#62c48d; --warn:#e3a84f; --bad:#f2786e;
  --good-bg:#16301f; --warn-bg:#36280f; --bad-bg:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191f1c; --sunk:#222a26; --ink:#e4eae6; --muted:#97a39c; --line:#2d3631;
  --accent:#74b3de; --accent-ink:#0d1a24; --good:#62c48d; --warn:#e3a84f; --bad:#f2786e;
  --good-bg:#16301f; --warn-bg:#36280f; --bad-bg:#3a1714; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{font-family:var(--f-head);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:20px;letter-spacing:.01em} h2{font-size:17px} h3{font-size:15px}
.num,input.n,td.n,.money{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto}
.brand .site{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:6px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.save{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.notice{margin:12px 0;padding:10px 12px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1px solid var(--line)}
button.btn{font:500 14px var(--f-body);border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn.small{padding:4px 10px;font-size:13px}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.link{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
section.view{padding-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.blue{background:var(--sunk);color:var(--accent)}
.result{font:600 26px var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.result.good{color:var(--good)} .result.warn{color:var(--warn)} .result.bad{color:var(--bad)}
ul.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.alerts li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:14px}
ul.alerts li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:6px;background:var(--muted)}
ul.alerts li.red::before{background:var(--bad)} ul.alerts li.amber::before{background:var(--warn)} ul.alerts li.info::before{background:var(--line)}
.shiftcard{display:flex;flex-direction:column;gap:10px}
.shiftcard .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.brief{white-space:pre-wrap;font:14px/1.5 var(--f-body);background:var(--sunk);border-radius:6px;padding:12px;margin:0}
/* shift form */
.shiftlayout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.shiftlayout{grid-template-columns:minmax(0,1fr) 340px}.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto}}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3::before{content:"▸";display:inline-block;width:16px;color:var(--muted);transition:transform .15s}
details.sec[open]>summary h3::before{transform:rotate(90deg)}
details.sec .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.sum{font:500 13px var(--f-num);color:var(--muted);text-align:right}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
input,select{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input.n{text-align:right}
input.bad{border-color:var(--bad);background:var(--bad-bg)}
input:disabled,select:disabled{opacity:.75}
table.lines td{padding:4px}
table.lines input,table.lines select{padding:6px 8px}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1}
.stepper{display:flex;gap:0;flex-wrap:wrap;font-size:13px}
.stepper span{padding:4px 10px;border:1px solid var(--line);margin-left:-1px;color:var(--muted);background:var(--surface)}
.stepper span:first-child{border-radius:6px 0 0 6px;margin-left:0}.stepper span:last-child{border-radius:0 6px 6px 0}
.stepper span.done{color:var(--good)} .stepper span.now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}
.kv .n{text-align:right}
.kv .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:600}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs a img{width:88px;height:88px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.pumpcell{white-space:nowrap}.pumpcell small{display:block;color:var(--muted);font-size:12px}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.mbar .result{font-size:18px}
@media (min-width:900px){.mbar{display:none}}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="topin">
  <div class="brand"><span class="site">TotalEnergies Perth Road · Westdene</span><h1>Shift Close</h1></div>
  <nav class="tabs" aria-label="Sections">
    <button id="tab-today" data-tab="today" aria-current="page">Today</button>
    <button id="tab-shift" data-tab="shift">Shift</button>
    <button id="tab-settings" data-tab="settings">Settings</button>
  </nav>
  <span class="save" id="saveState" aria-live="polite"></span>
</div></header>

<div class="wrap">
  <div id="banner"></div>

  <section class="view" id="view-today">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="row"><label class="f" for="dayPick" style="flex-direction:row;align-items:center;gap:8px"><span>Fuel day (06:00 to 06:00)</span>
        <input type="date" id="dayPick" style="width:auto"></label></div>
      <div class="row"><button class="btn" id="newDay">Start day shift</button><button class="btn" id="newNight">Start night shift</button></div>
    </div>
    <div class="grid2" id="dayCards"><div class="panel empty">Loading shifts…</div></div>
    <div class="panel stack" style="margin-top:12px">
      <div class="row" style="justify-content:space-between"><h2>Fuel, 24 hours</h2><span class="small muted">Opening tanks at the day shift start, closing at the night shift end</span></div>
      <div class="tablewrap" id="fuelDay"></div>
      <ul class="alerts" id="fuelDayAlerts"></ul>
    </div>
    <div class="panel stack" style="margin-top:12px">
      <div class="row" style="justify-content:space-between"><h2>Morning brief</h2><button class="btn small" id="copyBrief">Copy</button></div>
      <pre class="brief" id="brief">Pick a fuel day to see its brief.</pre>
    </div>
    <div class="panel stack" style="margin-top:12px">
      <h2>Recent shifts</h2>
      <div class="tablewrap" id="recent"></div>
    </div>
  </section>

  <section class="view" id="view-shift" hidden>
    <div id="shiftEmpty" class="panel empty">Choose a shift on the Today tab, or start a new one.</div>
    <div id="shiftWrap" hidden>
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div class="stack" style="gap:4px"><h2 id="shiftTitle"></h2><div class="stepper" id="stepper"></div></div>
        <div class="row" id="actions"></div>
      </div>
      <div id="reopenBox" class="panel row" hidden style="margin-bottom:10px">
        <label class="f" for="reopenReason" style="flex:1">Reason for reopening (kept in the history)<input id="reopenReason" type="text" placeholder="e.g. Batch 862 amount entered wrongly"></label>
        <button class="btn primary" id="reopenGo">Reopen shift</button><button class="btn" id="reopenCancel">Cancel</button>
      </div>
      <div class="shiftlayout">
        <div class="stack" id="form"></div>
        <aside class="side stack" id="side"></aside>
      </div>
      <div class="mbar" id="mbar"><span class="result" id="mbarRes">—</span><span class="row"><span id="mbarPills"></span><button class="btn small" id="mbarGo">See checks</button></span></div>
    </div>
  </section>

  <section class="view" id="view-settings" hidden>
    <div class="stack" id="settingsForm"></div>
  </section>
</div>

  const rateRows = Object.entries(S.rates).map(([k,v])=>{ const [c,g]=k.split("|"); return {customer:c, grade:g==="*"?"":g, rate:v}; });
  const staffT = el("tbody",{}), rateT = el("tbody",{});
  const drawStaff = ()=>{ staffT.replaceChildren(...S.staff.map((s,i)=>el("tr",{}, el("td",{}, textInput("st-"+i+"-name",()=>s.name,v=>{s.name=v;},{label:"Name"})), el("td",{}, textInput("st-"+i+"-pos",()=>s.posNo,v=>{s.posNo=v.trim()||undefined;},{label:"POS cashier no.",ph:"none"})),
    el("td",{}, el("button",{class:"x",onclick:()=>{S.staff.splice(i,1); drawStaff();},"aria-label":"Remove"},"×"))))); };
  const drawRates = ()=>{ rateT.replaceChildren(...rateRows.map((r,i)=>{ const g=el("select",{id:"rt-"+i+"-g","aria-label":"Grade"}, [["","All grades"],["D50","D50"],["ULP95","ULP 95"],["ULP93","ULP 93"]].map(([v,l])=>el("option",{value:v,text:l}))); g.value=r.grade; g.addEventListener("change",()=>r.grade=g.value);
    const rate=el("input",{id:"rt-"+i+"-r",class:"n",inputmode:"decimal","aria-label":"Rate per litre"}); rate.value=r.rate==null?"":(r.rate/100).toFixed(2); rate.addEventListener("input",()=>{ try{ r.rate=E.rand(rate.value); rate.classList.remove("bad"); }catch(e){ rate.classList.add("bad"); } });
    return el("tr",{}, el("td",{}, textInput("rt-"+i+"-c",()=>r.customer,v=>{r.customer=v;},{label:"Customer"})), el("td",{},g), el("td",{},rate), el("td",{}, el("button",{class:"x",onclick:()=>{rateRows.splice(i,1); drawRates();},"aria-label":"Remove"},"×"))); })); };
  drawStaff(); drawRates();
  const num2 = (id, val, cb) => { const i=el("input",{id,class:"n",inputmode:"decimal"}); i.value=val; i.addEventListener("input",()=>cb(i.value)); return i; };
  let tcRate = (S.totalCardRebate?.D50 ?? 4585)/1000, taxi=(S.taxiRate??80)/100, red=(S.tol.cashRed??500)/100, pumpPct=S.tol.pumpPct, tankPct=S.tol.tankPct, dropPct=S.tol.dropPct;
  const saveBtn = el("button",{class:"btn primary",disabled:!canEdit,onclick:async()=>{
    const rates={}; for (const r of rateRows) if(r.customer.trim() && r.rate!=null) rates[`${r.customer.trim()}|${r.grade||"*"}`]=r.rate;
    const out = {...S, rates, staff:S.staff.filter(s=>s.name&&s.name.trim()), taxiRate:Math.round(Number(taxi)*100), totalCardRebate:{D50:Math.round(Number(tcRate)*1000)},
      tol:{cashAmber:0, cashRed:Math.round(Number(red)*100), pumpPct:Number(pumpPct), tankPct:Number(tankPct), dropPct:Number(dropPct)}};
    if ([out.taxiRate,out.totalCardRebate.D50,out.tol.cashRed,out.tol.pumpPct,out.tol.tankPct,out.tol.dropPct].some(x=>!Number.isFinite(x))){ banner("Some settings are not numbers. Check the fields and save again."); return; }
    try{ await st.db.doc("settings/site").set(out); st.settings=out; banner(""); saveBtn.textContent="Saved"; setTimeout(()=>saveBtn.textContent="Save settings",1500); }
    catch(e){ banner(e.code==="invalid_argument"?"Only Abdul or an Editor can change settings.":"Settings not saved. Try again."); } }},"Save settings");
  $("settingsForm").replaceChildren(
    canEdit? null : el("div",{class:"notice",text:"Only Abdul or an Editor can change settings. You can see them here."}),
    el("div",{class:"panel stack"}, el("h2",{text:"Staff and POS logins"}), el("div",{class:"small muted",text:"Each cashier's own POS cashier number. The app flags any shift where the POS login belongs to someone else."}),
      el("div",{class:"tablewrap"}, el("table",{class:"lines"}, el("thead",{},el("tr",{},el("th",{text:"Name"}),el("th",{text:"POS cashier no."}),el("th",{}))), staffT)),
      el("div",{}, el("button",{class:"btn small",onclick:()=>{S.staff.push({name:"",posNo:undefined}); drawStaff();}},"Add person"))),
    el("div",{class:"panel stack"}, el("h2",{text:"Agreed rebate rates"}), el("div",{class:"small muted",text:"Rand per litre. Every rebate line for these customers is checked against this rate (cut to the cent, as the POS does)."}),
      el("div",{class:"tablewrap"}, el("table",{class:"lines"}, el("thead",{},el("tr",{},el("th",{text:"Customer (as written on Page 2)"}),el("th",{text:"Grade"}),el("th",{class:"n",text:"R per litre"}),el("th",{}))), rateT)),
      el("div",{}, el("button",{class:"btn small",onclick:()=>{rateRows.push({customer:"",grade:"",rate:null}); drawRates();}},"Add rate")),
      el("div",{class:"fields"}, field("Taxi rebate, R per litre", num2("set-taxi",taxi.toFixed(2),v=>taxi=v)), field("Total Card rebate, R per litre (diesel)", num2("set-tc",tcRate.toFixed(3),v=>tcRate=v)))),
    el("div",{class:"panel stack"}, el("h2",{text:"Tolerances"}),
      el("div",{class:"fields"}, field("Cash red above (R)", num2("set-red",red.toFixed(2),v=>red=v)), field("Pumps vs POS red above (% of sales)", num2("set-pump",String(pumpPct),v=>pumpPct=v)),
        field("Tank variance amber above (% of sales)", num2("set-tank",String(tankPct),v=>tankPct=v)), field("Delivery gauge vs truck amber above (%)", num2("set-drop",String(dropPct),v=>dropPct=v))),
      el("div",{class:"small muted",text:"Cash: any difference shows amber; above the red amount it shows red. Tank variance above 0.5% of sales is red."})),
    el("div",{class:"row"}, saveBtn));
}

/* ---------- boot ---------- */
async function boot(){
  const fallback = setTimeout(()=>{ if(!st.db){ $("dayCards").replaceChildren(el("div",{class:"panel empty",text:"Sign in to claude.ai to see and enter shifts."})); } }, 11000);
  const [db,user,assets] = await Promise.all([window.claude?.use("db"), window.claude?.use("user"), window.claude?.use("assets")]);
  clearTimeout(fallback);
  st.db=db; st.user=user; st.assets=assets||null;
  if (!db){ $("dayCards").replaceChildren(el("div",{class:"panel empty",text:"Sign in to claude.ai to see and enter shifts."})); banner("Shift records are not available in this view."); return; }
  if (user){ st.me = await user.id(); st.canEdit = await user.canEdit(); const w = await user.can("data.write"); if (w===false){ st.readOnly=true; banner("You can view shifts but not change them. Ask Abdul to give you Contributor access."); } }
  db.doc("settings/site").onSnapshot((s)=>{ if(s.exists){ st.settings = Object.assign(clone(DEFAULT_SETTINGS), s.data()); } st.settingsLoaded=true; if(st.tab==="settings") renderSettings(); else if(st.tab==="today") renderToday(); }, (e)=>console.error(e));
  db.collection("shifts").orderBy("date","desc").limit(400).onSnapshot((snap)=>{
    const next={}; for (const d of snap.docs) next[d.id]=d.data();
    if (st.curId && st.dirty && st.doc) next[st.curId]=clone(st.doc); // keep unsaved local edits
    st.shifts=next;
    if (st.tab==="today") renderToday();
    if (st.tab==="shift" && st.curId && next[st.curId] && !st.dirty && !st.saving){
      const incoming = normalize(next[st.curId]);
      if (JSON.stringify(incoming)!==JSON.stringify(st.doc)){ st.doc=incoming; const a=document.activeElement?.id; buildForm(); if(a&&$(a)) $(a).focus(); }
    }
  }, (e)=>{ console.error(e); banner("Lost the connection to shift records. Reload the page."); });
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });
let startTab="today"; try{ startTab=localStorage.getItem("sc.tab")||"today"; }catch(e){}
showTab(startTab==="shift"?"today":startTab);
boot();
})();
</script>
